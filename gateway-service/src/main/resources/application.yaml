server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-ingest-route
              uri: http://localhost:8081  # Forwarding to our Ingest Service
              predicates:
                - Path=/api/v1/bookings/**
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 100 # How many tokens allowed per second
                    redis-rate-limiter.burstCapacity: 200 # Max burst capacity allowed in a single second
                    key-resolver: "#{@userKeyResolver}"
