server:
  port: 8081

spring:
  application:
    name: booking-ingest-service

  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  threads:
    virtual:
      enabled: true # Keeps our standard Web MVC stack blazing fast under high I/O wait times

  data:
    redis:
      host: localhost
      port: 6380
      timeout: 1s

  cloud:
    stream:
      bindings:
        outboundBooking-out-0:
          destination: booking-confirmed-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          outboundBooking-out-0:
            producer:
              sync: true
              configuration:
                acks: all
resilience4j:
  circuitbreaker:
    instances:
      redisInventory:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.dao.DataAccessResourceFailureException
          - org.springframework.dao.QueryTimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
