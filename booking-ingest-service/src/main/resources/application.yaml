server:
  port: 8081

spring:
  application:
    name: booking-ingest-service

  datasource:
    url: jdbc:postgresql://localhost:5433/booking_db
    username: postgres
    password: password
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  threads:
    virtual:
      enabled: true # Keeps our standard Web MVC stack blazing fast under high I/O wait times

  data:
    redis:
      host: localhost
      port: 6380

  cloud:
    stream:
      bindings:
        outboundBooking-out-0:
          destination: booking-confirmed-topic
          content-type: application/json
      kafka:
        binder:
          brokers: localhost:9092
