name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A new push to the same branch cancels the run still in flight. Without this, pushing
# three times in a minute queues three full builds and you wait for all of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # Without this, the first service to fail cancels the other two and you learn
      # about one problem per push instead of all of them.
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - booking-ingest-service
          - booking-worker-service

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers needs a Docker daemon. ubuntu-latest runners have one running
      # already, so this requires no setup — it is only here to fail loudly and early
      # if that ever stops being true, rather than deep inside a confusing test error.
      - name: Verify Docker is available
        run: docker version

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7
