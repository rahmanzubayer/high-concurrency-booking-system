name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A new push to the same branch cancels the run still in flight. Without this, pushing
# three times in a minute queues three full builds and you wait for all of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # Without this, the first service to fail cancels the other two and you learn
      # about one problem per push instead of all of them.
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - booking-ingest-service
          - booking-worker-service

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers needs a Docker daemon. ubuntu-latest runners have one running
      # already, so this requires no setup — it is only here to fail loudly and early
      # if that ever stops being true, rather than deep inside a confusing test error.
      - name: Verify Docker is available
        run: docker version

      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  publish:
    name: Publish ${{ matrix.service }}
    # Images are only built from code that already passed every test.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The workflow-level default is contents:read. Pushing to GHCR needs packages:write,
    # granted here only — the test jobs above have no ability to publish anything.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - booking-ingest-service
          - booking-worker-service

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Issued automatically per run. No personal access token to create, store or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache stored in GitHub Actions cache, so Maven dependencies are not
          # re-downloaded on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
